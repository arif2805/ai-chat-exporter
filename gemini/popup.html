<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 1.5em; }
    .note { font-size: 12px; color: #555; margin: 0; }
  </style>
</head>
<body>
  <h1>Export this Gemini chat</h1>
  <p class="note">Long chats are scrolled automatically to load every message. This can take a few seconds.</p>
  <button id="md">Download Markdown</button>
  <button id="json">Download JSON</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
